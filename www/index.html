<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#0B2D5B" />
    <title>CourseCollab</title>
    <style>
      * { box-sizing: border-box; margin: 0; padding: 0; }
      body {
        min-height: 100vh;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        background: #f8fafc;
        color: #0B2D5B;
      }
      .screen { display: none; min-height: 100vh; align-items: center; justify-content: center; padding: 1.5rem; }
      .screen.active { display: flex; }
      .card {
        max-width: 340px; width: 100%; background: #fff; border-radius: 1.25rem;
        padding: 1.75rem 1.5rem; text-align: center;
        box-shadow: 0 8px 32px rgba(11,45,91,0.12);
      }
      .logo { width: 72px; height: 72px; object-fit: contain; margin: 0 auto 1rem; }
      h1 { font-size: 1.25rem; margin-bottom: 0.5rem; }
      p { font-size: 0.875rem; line-height: 1.5; color: #64748b; }
      button {
        margin-top: 1.25rem; background: #0B2D5B; color: #fff; border: 0;
        border-radius: 999px; padding: 0.65rem 1.25rem; font-weight: 600; font-size: 0.9375rem;
      }
      .dots { display: flex; gap: 0.5rem; justify-content: center; margin-top: 1.25rem; }
      .dot { width: 8px; height: 8px; border-radius: 50%; background: #0B2D5B; animation: pulse 1.2s infinite; }
      .dot:nth-child(2) { animation-delay: 0.2s; opacity: 0.7; }
      .dot:nth-child(3) { animation-delay: 0.4s; opacity: 0.45; }
      @keyframes pulse { 0%, 100% { transform: scale(1); } 50% { transform: scale(1.15); } }
    </style>
  </head>
  <body>
    <div id="loading" class="screen active">
      <div class="card">
        <img class="logo" src="../assets/icon.png" alt="CourseCollab" />
        <h1>Loading CourseCollab</h1>
        <p>Getting your courses and dashboard ready…</p>
        <div class="dots"><span class="dot"></span><span class="dot"></span><span class="dot"></span></div>
      </div>
    </div>
    <div id="offline" class="screen">
      <div class="card">
        <img class="logo" src="../assets/icon.png" alt="CourseCollab" />
        <h1>You're offline</h1>
        <p>CourseCollab needs an internet connection for lectures, quizzes, and grades. Check Wi‑Fi or cellular data, then try again.</p>
        <button type="button" onclick="location.reload()">Try again</button>
      </div>
    </div>
    <script>
      function show(id) {
        document.querySelectorAll(".screen").forEach(function (el) { el.classList.remove("active"); });
        document.getElementById(id).classList.add("active");
      }
      window.addEventListener("offline", function () { show("offline"); });
      window.addEventListener("online", function () { location.reload(); });
      setTimeout(function () {
        if (!navigator.onLine) show("offline");
      }, 1200);
    </script>
  </body>
</html>
