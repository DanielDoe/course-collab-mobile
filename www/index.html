<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover"
    />
    <meta name="theme-color" content="#582c83" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <title>CourseCollab</title>
    <style>
      :root {
        --primary: #582c83;
        --primary-light: #7a4eba;
        --gold: #eaaa00;
        --bg: #ffffff;
        --text: #252525;
      }
      @media (prefers-color-scheme: dark) {
        :root {
          --bg: #0f172a;
          --text: #f1f5f9;
        }
      }
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
      }
      html,
      body {
        height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Inter, sans-serif;
        background: var(--bg);
        color: var(--text);
      }
      .splash {
        min-height: 100%;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        gap: 1.25rem;
        padding: env(safe-area-inset-top) 1.5rem env(safe-area-inset-bottom);
        background:
          radial-gradient(ellipse 80% 60% at 70% 20%, rgba(88, 44, 131, 0.12), transparent 50%),
          var(--bg);
      }
      .logo {
        width: 88px;
        height: 88px;
        border-radius: 22px;
        background: linear-gradient(135deg, var(--primary) 0%, var(--primary-light) 100%);
        display: flex;
        align-items: center;
        justify-content: center;
        box-shadow: 0 12px 40px rgba(88, 44, 131, 0.35);
      }
      .logo svg {
        width: 44px;
        height: 44px;
        color: #fff;
      }
      h1 {
        font-size: 1.75rem;
        font-weight: 700;
        letter-spacing: -0.02em;
      }
      p {
        font-size: 0.95rem;
        opacity: 0.65;
        text-align: center;
        max-width: 280px;
      }
      .spinner {
        width: 28px;
        height: 28px;
        border: 3px solid rgba(88, 44, 131, 0.2);
        border-top-color: var(--primary);
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-top: 0.5rem;
      }
      @keyframes spin {
        to {
          transform: rotate(360deg);
        }
      }
    </style>
  </head>
  <body>
    <div class="splash">
      <div class="logo" aria-hidden="true">
        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
          <path d="M21.42 10.922a1 1 0 0 0-.019-1.838L12.83 5.18a2 2 0 0 0-1.66 0L2.6 9.08a1 1 0 0 0 0 1.832l8.57 3.908a2 2 0 0 0 1.66 0z"/>
          <path d="M22 10v6"/>
          <path d="M6 12.5V16a6 3 0 0 0 12 0v-3.5"/>
        </svg>
      </div>
      <h1>CourseCollab</h1>
      <p>Loading your learning hub…</p>
      <div class="spinner" role="status" aria-label="Loading"></div>
    </div>
  </body>
</html>
