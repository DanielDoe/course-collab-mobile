appId: com.coursecollab.app
---
- tapOn:
    text: "Close menu"
    optional: true
- tapOn: "Open navigation menu"
- scrollUntilVisible:
    element: "Assessments"
    direction: DOWN
    timeout: 12000
- tapOn: "Assessments"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Question Bank"
    direction: DOWN
    timeout: 12000
- tapOn: "Question Bank"
- tapOn:
    text: "Close menu"
    optional: true
- extendedWaitUntil:
    visible: "Question Bank|Search questions|Create question"
    timeout: 25000
