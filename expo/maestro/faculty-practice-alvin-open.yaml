appId: com.coursecollab.app
---
- tapOn: "Students"
- tapOn: "Alvin Pulickal Reni, 10 attempts, 76 percent average"
- extendedWaitUntil:
    visible: "Practice progress"
    timeout: 10000
- scrollUntilVisible:
    element: "View full report. Attempts, answers, and topic breakdown"
    direction: DOWN
    timeout: 10000
- tapOn: "View full report. Attempts, answers, and topic breakdown"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Practice report"
    timeout: 15000
- tapOn: "Done"
- tapOn: "Clear search"
