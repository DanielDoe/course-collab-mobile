appId: com.coursecollab.app
---
- openLink: coursecollab://dev-student-login
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 90000
- takeScreenshot: drawer-dashboard

# Learning
- tapOn: "Open navigation menu"
- tapOn: "Lectures"
- extendedWaitUntil:
    visible: "Lectures"
    timeout: 30000
- extendedWaitUntil:
    visible: "Lecture|Completed|Not Started|In Progress"
    timeout: 30000
    optional: true
- tapOn:
    text: ".*Lecture 1.*"
    optional: true
- tapOn:
    text: "Tools"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- back
- takeScreenshot: drawer-lectures

- tapOn: "Open navigation menu"
- tapOn: "My Notes"
- extendedWaitUntil:
    visible: "My Notes"
    timeout: 30000
- tapOn:
    text: "Course Notes"
    optional: true
- tapOn:
    text: "My Notes"
    optional: true
- tapOn:
    text: "Search my notes…"
    optional: true
- inputText: "Exam"
- hideKeyboard
- takeScreenshot: drawer-notes

- tapOn: "Open navigation menu"
