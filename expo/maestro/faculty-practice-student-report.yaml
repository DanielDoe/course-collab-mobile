appId: com.coursecollab.app
---
- scrollUntilVisible:
    element: "View full report. Attempts, answers, and topic breakdown"
    direction: DOWN
    timeout: 10000
- tapOn: "View full report. Attempts, answers, and topic breakdown"
- waitForAnimationToEnd
- extendedWaitUntil:
    visible: "Practice report"
    timeout: 12000
- tapOn: "Done"
- tapOn: "Daniel Doe"
- scrollUntilVisible:
    element: "Reset all practice progress. Clears all practice data for this student"
    direction: DOWN
    timeout: 10000
- tapOn: "Reset all practice progress. Clears all practice data for this student"
- tapOn: "Cancel"
- tapOn: "Done"
