appId: com.coursecollab.app
---
- tapOn: "Open navigation menu"
- waitForAnimationToEnd
- tapOn: "Dashboard"
- tapOn:
    text: "Close menu"
    optional: true
- extendedWaitUntil:
    visible: "Instructor|Submissions"
    timeout: 20000
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 500
- swipe:
    start: 50%, 80%
    end: 50%, 20%
    duration: 500
- scrollUntilVisible:
    element: "Playground"
    direction: UP
    timeout: 10000
    visibilityPercentage: 80
- tapOn: "Playground"
- extendedWaitUntil:
    visible: "Playground|Session|Question bank|Create session"
    timeout: 25000
- takeScreenshot: dest-playground
