- tapOn: "Open navigation menu"
- tapOn: "Manage Practice"
- extendedWaitUntil:
    visible: "Practice"
    timeout: 45000
- swipe:
    direction: UP
- tapOn:
    text: "Create practice"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
