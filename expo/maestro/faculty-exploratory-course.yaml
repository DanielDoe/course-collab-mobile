appId: com.coursecollab.app
---
- openLink: coursecollab://dev-faculty-login
- extendedWaitUntil:
    visible: "Select a course|Dashboard"
    timeout: 90000
- tapOn:
    text: "ECE 2202"
    optional: true
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 90000
- swipe:
    direction: UP
- swipe:
    direction: UP
- tapOn:
    text: "View all"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Go back"
    optional: true
- back
- takeScreenshot: fac-dashboard

- tapOn: "Open navigation menu"
- tapOn: "Academic Terms"
- extendedWaitUntil:
    visible: "Academic Terms"
    timeout: 30000
- swipe:
    direction: UP
- tapOn:
    text: "New term"
    optional: true
- tapOn:
    text: "Add term"
    optional: true
- tapOn:
    text: "Create"
    optional: true
- tapOn:
    text: "2026"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- takeScreenshot: fac-terms

- tapOn: "Open navigation menu"
- tapOn: "Announcements"
- extendedWaitUntil:
    visible: "Announcements"
    timeout: 30000
- tapOn:
    text: "Search title, summary, section…"
    optional: true
- inputText: "exam"
- hideKeyboard
- tapOn:
    text: "New announcement"
    optional: true
- tapOn:
    text: "e.g. Mid-semester exam schedule"
    optional: true
- inputText: "QA title check"
- tapOn:
    text: "Write what students need to know…"
    optional: true
- inputText: "QA body check"
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- swipe:
    direction: UP
- takeScreenshot: fac-announcements

- tapOn: "Open navigation menu"
- tapOn: "Syllabus"
- extendedWaitUntil:
    visible: "Syllabus"
    timeout: 30000
- tapOn:
    text: "Search syllabus sections…"
    optional: true
- inputText: "grading"
- hideKeyboard
- tapOn:
    text: "Add syllabus section"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- swipe:
    direction: UP
- takeScreenshot: fac-syllabus

- tapOn: "Open navigation menu"
- tapOn: "Manage Lectures"
- extendedWaitUntil:
    visible: "Lectures|Manage Lectures"
    timeout: 30000
- tapOn:
    text: "Search lectures…"
    optional: true
- inputText: "Thevenin"
- hideKeyboard
- tapOn:
    text: ".*Lecture.*"
    index: 0
    optional: true
- swipe:
    direction: UP
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Go back"
    optional: true
- back
- tapOn:
    text: "Create lecture"
    optional: true
- tapOn:
    text: "New lecture"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- takeScreenshot: fac-lectures

- tapOn: "Open navigation menu"
- tapOn: "Course Notes"
- extendedWaitUntil:
    visible: "Course Notes"
    timeout: 30000
- tapOn:
