    optional: true
- inputText: "exam"
- hideKeyboard
- swipe:
    direction: UP
- tapOn:
    text: "Create note"
    optional: true
- tapOn:
    text: "New note"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- takeScreenshot: fac-notes

- tapOn: "Open navigation menu"
- tapOn: "Flashcards"
- extendedWaitUntil:
    visible: "Flashcards"
    timeout: 30000
- tapOn:
    text: "Search flashcard decks…"
    optional: true
- inputText: "circuit"
- hideKeyboard
- tapOn:
    text: "Create deck"
    optional: true
- tapOn:
