appId: com.coursecollab.app
---
- openLink: coursecollab://dev-student-login
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 120000
- openLink: coursecollab:///lecture/1?lectureId=65
- extendedWaitUntil:
    visible: "Back to Lectures"
    timeout: 90000
- extendedWaitUntil:
    visible: "Ask Cora about these slides"
    timeout: 30000
- takeScreenshot: student-lecture-pdf-cora-fab
- tapOn:
    text: "Ask Cora about these slides"
- extendedWaitUntil:
    visible: "Ask Cora|Message Cora|Cora"
    timeout: 45000
- takeScreenshot: student-lecture-cora-chat
- back
- extendedWaitUntil:
    visible: "Back to Lectures"
    timeout: 30000
- tapOn:
    text: "Open lecture tools"
- extendedWaitUntil:
    visible: "Slide tools"
    timeout: 30000
- takeScreenshot: student-lecture-tools-sheet
