appId: com.coursecollab.app
---
- openLink: coursecollab://dev-student-login
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 30000
- openLink: "coursecollab:///practice/topic?topic=Chapter%201%3A%20Circuit%20Fundamentals%20Playground"
- extendedWaitUntil:
    visible: "Start Practice"
    timeout: 20000
- tapOn: "Start Practice"
- extendedWaitUntil:
    visible: "Submit answer"
    timeout: 25000
- takeScreenshot: practice-hub-options
- tapOn: "Option A"
- tapOn: "Submit answer"
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: practice-hub-feedback
- extendedWaitUntil:
    visible: "2/20"
    timeout: 8000
    optional: true
- tapOn: "1"
- takeScreenshot: practice-hub-q1-review
- tapOn: "3"
- takeScreenshot: practice-hub-q3
- tapOn: "4"
- takeScreenshot: practice-hub-q4
- tapOn: "5"
- takeScreenshot: practice-hub-q5
- tapOn: "6"
- takeScreenshot: practice-hub-q6
