appId: com.coursecollab.app
---
- openLink: coursecollab://dev-faculty-login
- extendedWaitUntil:
    visible: "Select a course|Dashboard|ECE 2202|Open navigation menu"
    timeout: 90000
- tapOn:
    text: "Close menu"
    optional: true
- tapOn:
    text: "Close account menu"
    optional: true
- tapOn:
    text: "ECE 2202"
    optional: true
- extendedWaitUntil:
    visible: "Dashboard|Open navigation menu|Instructor|Select a course"
    timeout: 90000
- tapOn:
    id: "open-navigation-menu"
- scrollUntilVisible:
    element: "Dashboard"
    direction: UP
    timeout: 12000
- tapOn: "Dashboard"
- tapOn:
    text: "Close menu"
    optional: true
- extendedWaitUntil:
    visible: "Instructor|Loading course dashboard|Select a Course"
    timeout: 30000
- tapOn:
    text: "Dismiss"
    optional: true
- tapOn:
    text: "Not now"
    optional: true
- tapOn:
    text: "OK"
    optional: true
