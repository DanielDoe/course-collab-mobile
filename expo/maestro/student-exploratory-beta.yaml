appId: com.coursecollab.app
---
- openLink: coursecollab://dev-student-login
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 90000
- takeScreenshot: beta-dashboard

# Messages — verify course-import preview + compose + thread
- openLink: coursecollab:///module/messages
- extendedWaitUntil:
    visible: "Messages"
    timeout: 30000
- tapOn:
    text: "Search conversations…"
    optional: true
- inputText: "Daniel"
- hideKeyboard
- tapOn:
    text: "Daniel Doe"
    optional: true
- extendedWaitUntil:
    visible: "Course question|Daniel Doe|Messages"
    timeout: 15000
    optional: true
- tapOn:
    text: "Close"
    optional: true
- back
- tapOn:
    text: "New message"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- takeScreenshot: beta-messages

# Forum
- openLink: coursecollab:///module/forum
- extendedWaitUntil:
