appId: com.coursecollab.app
---
- tapOn: "Manage Practice"
- tapOn: "AC Power, Available"
- extendedWaitUntil:
    visible: "Topic settings"
    timeout: 12000
- tapOn: "Hide all shown"
- extendedWaitUntil:
    visible: "Hide all questions?"
    timeout: 8000
- tapOn: "Cancel"
- tapOn: "Topic settings"
- waitForAnimationToEnd
- tapOn: "Questions per day"
- eraseText
- inputText: "12"
- tapOn: "Practice topic"
- tapOn: "Done"
