appId: com.coursecollab.app
---
- tapOn: "Open navigation menu"
- scrollUntilVisible:
    element: "Student Directory"
    direction: DOWN
    timeout: 10000
- tapOn: "Student Directory"
- extendedWaitUntil:
    visible: "Directory|Students"
    timeout: 45000
- tapOn:
    text: "Search students…"
    optional: true
- inputText: "daniel"
- hideKeyboard
- tapOn:
    text: ".*Daniel.*"
    index: 0
    optional: true
- swipe:
    direction: UP
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Go back"
    optional: true
- back
- takeScreenshot: fac-directory

- tapOn: "Open navigation menu"
- scrollUntilVisible:
    element: "Campers"
    direction: DOWN
    timeout: 10000
- tapOn: "Campers"
- extendedWaitUntil:
    visible: "Campers|Camp"
    timeout: 30000
- swipe:
    direction: UP
- takeScreenshot: fac-campers

- tapOn: "Open navigation menu"
- scrollUntilVisible:
