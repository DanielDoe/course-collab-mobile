appId: com.coursecollab.app
---
- openLink: coursecollab://dev-student-login
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 90000
- openLink: coursecollab:///module/forum
- extendedWaitUntil:
    visible: "Forum Hub|Forum|Discussions"
    timeout: 30000
- tapOn:
    text: "Search threads…"
    optional: true
- inputText: "circuit"
- hideKeyboard
- takeScreenshot: exploratory-forum
- openLink: coursecollab:///module/messages
- extendedWaitUntil:
    visible: "Messages"
    timeout: 30000
- tapOn: "Search conversations…"
- inputText: "Behlool"
- hideKeyboard
- tapOn:
    point: "92%,92%"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- takeScreenshot: exploratory-messages
- openLink: coursecollab:///module/groups
- extendedWaitUntil:
    visible: "Groups"
    timeout: 30000
- tapOn:
    text: "Search groups…"
    optional: true
- inputText: "team"
- hideKeyboard
- takeScreenshot: exploratory-groups
