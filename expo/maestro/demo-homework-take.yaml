# Q11 code_write — largest of 5 ints
- tapOn: "Code editor"
- inputText: "#include <iostream>\nusing namespace std;\nint main(){\n  int a[5];\n  cout<<\"Enter 5 integers: \";\n  for(int i=0;i<5;i++) cin>>a[i];\n  int m=a[0];\n  for(int i=1;i<5;i++) if(a[i]>m) m=a[i];\n  cout<<\"Largest: \"<<m<<endl;\n  return 0;\n}\n"
- tapOn: "Submit answer"
- extendedWaitUntil:
    visible: "Code write"
    timeout: 180000
- takeScreenshot: demo-hw-q11-ai

# Q12 code_write — triangle type
- tapOn: "Code editor"
- inputText: "#include <iostream>\nusing namespace std;\nint main(){\n  double a,b,c;\n  cout<<\"Enter three sides: \";\n  cin>>a>>b>>c;\n  if(a<=0||b<=0||c<=0||a+b<=c||a+c<=b||b+c<=a){ cout<<\"Invalid triangle\\n\"; return 0; }\n  if(a==b&&b==c) cout<<\"Equilateral\\n\";\n  else if(a==b||b==c||a==c) cout<<\"Isosceles\\n\";\n  else cout<<\"Scalene\\n\";\n  return 0;\n}\n"
- tapOn: "Submit answer"
- extendedWaitUntil:
    visible: "Code + plot"
    timeout: 180000
- takeScreenshot: demo-hw-q12-ai

# Q13 code_write_plot — sin(x) zero crossings
- tapOn: "Code editor"
- inputText: "x = linspace(-2*pi, 2*pi, 1000);\ny = sin(x);\nplot(x, y, 'b-', 'LineWidth', 1.5);\nhold on;\ncross = y(1:end-1).*y(2:end) <= 0;\nplot(x(cross), zeros(sum(cross),1), 'ro', 'MarkerFaceColor', 'r');\nxlabel('x'); ylabel('y');\ntitle('y = sin(x) with zero crossings');\ngrid on;\n"
