# Q15 code_write — primes without isprime
- tapOn: "Code editor"
- inputText: "n = input('Enter n: ');\nprimes = [];\nfor k = 2:n\n  isP = true;\n  for d = 2:floor(sqrt(k))\n    if mod(k,d)==0\n      isP = false; break;\n    end\n  end\n  if isP, primes(end+1)=k; end\nend\ndisp(primes);\n"
- tapOn: "Submit answer"
- extendedWaitUntil:
    visible: "Code write"
    timeout: 180000
- takeScreenshot: demo-hw-q15-ai

# Q16 code_write — factorial with while
- tapOn: "Code editor"
- inputText: "#include <iostream>\nusing namespace std;\nint main(){\n  int n; cout<<\"Enter N: \"; cin>>n;\n  long long f=1; int i=1;\n  while(i<=n){ f*=i; i++; }\n  cout<<n<<\"! = \"<<f<<endl;\n  return 0;\n}\n"
- tapOn: "Submit answer"
- extendedWaitUntil:
