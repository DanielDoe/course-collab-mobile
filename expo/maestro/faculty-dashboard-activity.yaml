appId: com.coursecollab.app
---
- tapOn: ".*Homework 6.*"
- extendedWaitUntil:
    visible: "Recent Activity|Search student|Submitted|No activity"
    timeout: 25000
- takeScreenshot: dest-activity
- tapOn: "Open navigation menu"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Dashboard"
    direction: UP
    timeout: 12000
- tapOn: "Dashboard"
- tapOn:
    text: "Close menu"
    optional: true
- extendedWaitUntil:
    visible: "Instructor|Submissions"
    timeout: 25000
- takeScreenshot: dash-back
