appId: com.coursecollab.app
---
- tapOn: "Search sessions…"
- inputText: "zzz"
- tapOn: "Manage Playground"
- extendedWaitUntil:
    visible: "No matches|No matching sessions"
    timeout: 8000
- takeScreenshot: playground-search-empty
- tapOn: "Clear search"
- tapOn: "Search sessions…"
- inputText: "P31"
- tapOn: "Manage Playground"
- extendedWaitUntil:
    visible: "P31"
    timeout: 8000
- takeScreenshot: playground-search-match
- tapOn: "Clear search"
- tapOn: "Open filters"
- extendedWaitUntil:
    visible: "Filter sessions|All sessions"
    timeout: 10000
- takeScreenshot: playground-filters
- tapOn:
    text: "Lobby open.*"
- tapOn: "Open filters"
- tapOn:
    text: "Live now.*"
- tapOn: "Open filters"
- tapOn:
    text: "Ended.*"
- tapOn: "Open filters"
- tapOn: "All sessions"
