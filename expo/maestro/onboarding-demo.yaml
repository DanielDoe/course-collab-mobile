appId: com.coursecollab.app
---
- launchApp
- extendedWaitUntil:
    visible: "Get started"
    timeout: 60000
- takeScreenshot: onboarding-demo/01-welcome
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Terms & Policies"
    timeout: 30000
- takeScreenshot: onboarding-demo/02-terms-top
- scrollUntilVisible:
    element:
      text: ".*I have read and agree.*"
    direction: DOWN
    timeout: 15000
- takeScreenshot: onboarding-demo/02-terms-accept
- tapOn:
    text: ".*I have read and agree to the Terms of Service.*"
- tapOn: "Accept & continue"
- extendedWaitUntil:
    visible: "Cora privacy"
    timeout: 30000
- takeScreenshot: onboarding-demo/03-cora
- tapOn: "Save & continue"
- extendedWaitUntil:
    visible: "Choose your look"
    timeout: 30000
- takeScreenshot: onboarding-demo/04-appearance
