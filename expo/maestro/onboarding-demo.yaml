appId: com.coursecollab.app
---
- launchApp
- extendedWaitUntil:
    visible: "Get started"
    timeout: 60000
- takeScreenshot: onboarding-demo/01-welcome
- tapOn: "Get started"
- extendedWaitUntil:
    visible: "Terms of Service"
    timeout: 30000
- takeScreenshot: onboarding-demo/02-terms-top
- scrollUntilVisible:
    element:
      text: ".*I have read and agree.*"
    direction: DOWN
    timeout: 15000
- takeScreenshot: onboarding-demo/02-terms-accept
- tapOn: "I have read and agree to the Terms of Service"
- tapOn: "Accept & continue"
- extendedWaitUntil:
    visible: "Privacy Policy"
    timeout: 30000
- takeScreenshot: onboarding-demo/03-privacy
- scrollUntilVisible:
    element:
      text: ".*I have read and acknowledge the Privacy Policy.*"
    direction: DOWN
    timeout: 15000
- tapOn: "I have read and acknowledge the Privacy Policy"
- tapOn: "Accept & continue"
- extendedWaitUntil:
    visible: "AI Use & Data"
    timeout: 30000
- takeScreenshot: onboarding-demo/04-ai-disclosure
- scrollUntilVisible:
    element:
      text: ".*I have read and acknowledge the AI Use.*"
    direction: DOWN
    timeout: 15000
- tapOn: "I have read and acknowledge the AI Use & Data disclosure"
- tapOn: "Accept & continue"
- extendedWaitUntil:
    visible: "Cora privacy"
    timeout: 30000
- takeScreenshot: onboarding-demo/05-cora
- tapOn: "Save & continue"
- extendedWaitUntil:
    visible: "Choose your look"
    timeout: 30000
- takeScreenshot: onboarding-demo/06-appearance
