appId: com.coursecollab.app
---
- tapOn:
    text: "Done"
    optional: true
- tapOn: "Open navigation menu"
- waitForAnimationToEnd
- tapOn: "Course Notes"
- tapOn:
    text: "Close menu"
    optional: true
- extendedWaitUntil:
    visible: "Search course notes…|Create note|No course notes"
    timeout: 35000
- takeScreenshot: course-notes-page
