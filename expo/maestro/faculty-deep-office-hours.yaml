appId: com.coursecollab.app
---
- tapOn:
    text: "Close menu"
    optional: true
- tapOn:
    id: "open-navigation-menu"
- waitForAnimationToEnd
- scrollUntilVisible:
    element: "Office Hours"
    direction: DOWN
    timeout: 30000
- tapOn: "Office Hours"
- tapOn:
    text: "Close menu"
    optional: true
- extendedWaitUntil:
    visible: "Requests|Regular hours|Search student"
    timeout: 45000
- takeScreenshot: office-hours-landing

# Requests tab
- tapOn: "Requests tab"
- tapOn: "Search student, topic, or notes…"
- inputText: "zzz-no-match"
- hideKeyboard
- takeScreenshot: office-requests-search-empty
- tapOn:
    text: "Clear search"
    optional: true

# Open live request (cancel writes)
- tapOn:
    text: ".*"
    index: 0
    optional: true
- extendedWaitUntil:
    visible: "Approve|Decline|Meeting link"
    timeout: 15000
    optional: true
- takeScreenshot: office-request-detail
- tapOn: "Meeting link (optional)"
- inputText: "https://zoom.us/qa-test"
- tapOn: "Venue (optional)"
- inputText: "QA Room 101"
- tapOn: "Notes for student"
- inputText: "QA notes only"
- hideKeyboard
- tapOn: "Decline"
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Close"
    optional: true

# Action sheet + create QA request
- tapOn: "Office hours actions"
- extendedWaitUntil:
    visible: "New student request|Edit regular hours"
    timeout: 10000
- takeScreenshot: office-actions
- tapOn: "New student request"
- extendedWaitUntil:
    visible: "Create office hour request|Done"
    timeout: 15000
- takeScreenshot: office-create-empty
- tapOn:
    text: "Create"
    optional: true
- tapOn:
    text: "Student name"
    optional: true
- inputText: "QA99 Office Student"
- tapOn:
    text: "Topic"
    optional: true
- inputText: "QA99 Office Hours Topic"
- tapOn:
    text: "Description"
    optional: true
- inputText: "QA disposable office hours request"
- hideKeyboard
- tapOn:
    text: "Create"
    optional: true
- tapOn:
    text: "Save"
    optional: true
- extendedWaitUntil:
    visible: "Requests|QA99"
    timeout: 30000
    optional: true
- takeScreenshot: office-qa-created
- tapOn:
    text: "Done"
    optional: true

# Regular hours tab
- tapOn: "Regular hours tab"
- extendedWaitUntil:
    visible: "Search regular hours…|No regular hours"
    timeout: 15000
- takeScreenshot: office-schedule-tab
- tapOn: "Office hours actions"
- tapOn: "Edit regular hours"
- extendedWaitUntil:
    visible: "Regular office hours|Save regular hours|Add time slot"
    timeout: 15000
- takeScreenshot: office-regular-sheet
- tapOn:
    text: "Add time slot"
    optional: true
- tapOn:
    text: "Remove"
    index: 0
    optional: true
- tapOn:
    text: "Save regular hours"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Edit all regular hours"
    optional: true
- tapOn:
    text: "Done"
    optional: true
