appId: com.coursecollab.app
---
- stopApp
- openLink: coursecollab://dev-student-login
- extendedWaitUntil:
    visible: "Dashboard"
    timeout: 120000
- openLink: coursecollab:///lecture/3?lectureId=67
- extendedWaitUntil:
    visible: "Open lecture tools"
    timeout: 120000
- tapOn:
    text: "Open lecture tools"
- extendedWaitUntil:
    visible: "Slide tools"
    timeout: 30000
- assertVisible: ".*Workspace.*8 problems.*"
- tapOn:
    text: ".*Workspace.*8 problems.*"
- extendedWaitUntil:
    visible: ".*Problem 3.1.*"
    timeout: 90000
