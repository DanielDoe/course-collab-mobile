appId: com.coursecollab.app
---
- tapOn: "Question bank"
- extendedWaitUntil:
    visible: "Search topics…|Pick a topic"
    timeout: 15000
- tapOn: "Search topics…"
- inputText: "zzz"
- tapOn: "Manage Playground"
- extendedWaitUntil:
    visible: "No matches|No matching topics"
    timeout: 8000
- takeScreenshot: playground-bank-empty
- tapOn: "Clear search"
- tapOn: "AC Power"
- extendedWaitUntil:
    visible: "Select all|Create session|Search questions in this topic…|No questions"
    timeout: 15000
- takeScreenshot: playground-bank-ac
