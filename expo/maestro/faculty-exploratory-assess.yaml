appId: com.coursecollab.app
---
- tapOn: "Open navigation menu"
- scrollUntilVisible:
    element: "Manage Quizzes"
    direction: DOWN
    timeout: 10000
- tapOn: "Manage Quizzes"
- extendedWaitUntil:
    visible: "Quizzes"
    timeout: 45000
- tapOn:
    text: "Search quizzes…"
    optional: true
- inputText: "quiz"
- hideKeyboard
- tapOn:
    text: "Create quiz"
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Cancel"
    optional: true
- tapOn:
    text: ".*Quiz.*"
    index: 0
    optional: true
- swipe:
    direction: UP
    optional: true
- tapOn:
    text: "Done"
    optional: true
- tapOn:
    text: "Close"
    optional: true
- tapOn:
    text: "Go back"
    optional: true
- back
- takeScreenshot: fac-quizzes

