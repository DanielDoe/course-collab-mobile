name: App Store Release Audit

on:
  pull_request:
    paths:
      - "expo/**"
      - "docs/**"
      - ".github/workflows/app-store-audit.yml"
  push:
    branches:
      - main
    paths:
      - "expo/**"

jobs:
  release-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: expo
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: expo/package-lock.json
      - name: Install dependencies
        run: npm install
      - name: Release audit
        run: npm run release:audit
